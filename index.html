<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Comptabilité — Module 0 : Bilan, résultats, PCMN & TVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d14; --bg2:#121724; --bg3:#0e1320; --card:#161d2d;
  --accent:#22d68a; --accent-d:#0f7a4d; --orange:#ff8a3d; --gold:#ffd166;
  --blue:#4dabf7; --purple:#b197fc; --pink:#f783ac;
  --text:#e9eef7; --text2:#94a3b8; --text3:#5d6b81;
  --border:#243044; --border2:#2f3d55;
  --success:#22d68a; --error:#ff4d6d; --warn:#ffb020;
  --radius:16px; --radius-s:10px;
  --debit:#4dabf7; --credit:#ff8a3d;
  --shadow:0 18px 45px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--text); font-family:'Outfit',system-ui,sans-serif;
  min-height:100dvh; line-height:1.55; overflow-x:hidden;
  background-image:
    radial-gradient(1100px 520px at 12% -8%, rgba(34,214,138,.10), transparent 62%),
    radial-gradient(900px 460px at 92% 0%, rgba(255,138,61,.09), transparent 60%),
    linear-gradient(180deg,#0a0d14 0%,#0a0d14 100%);
  background-attachment:fixed;
}
.mono{font-family:'Space Mono',ui-monospace,monospace}
button{font-family:inherit}
::selection{background:rgba(34,214,138,.3)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

/* ============ LIGNE DE GRAND LIVRE (signature) ============ */
.ledger{
  position:relative; padding-left:18px;
}
.ledger:before{
  content:''; position:absolute; left:0; top:2px; bottom:2px; width:3px; border-radius:3px;
  background:linear-gradient(180deg,var(--accent),transparent);
}

/* ============ HEADER ============ */
.hdr{
  position:sticky; top:0; z-index:400; display:flex; align-items:center; gap:12px;
  justify-content:space-between; padding:10px 16px calc(10px + env(safe-area-inset-top,0px));
  background:rgba(10,13,20,.82); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.hdr-l{display:flex; align-items:center; gap:11px; min-width:0}
.logo{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,#1c2b3f,#101724); border:1px solid var(--border2);
  font-size:1.05rem; box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.hdr-title{font-weight:800;font-size:.98rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:.68rem;color:var(--text3);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.hdr-r{display:flex;align-items:center;gap:7px;flex-shrink:0}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  background:var(--bg2);border:1px solid var(--border);font-size:.8rem;font-weight:700;white-space:nowrap
}
.badge b{font-weight:800}
.badge.score{color:var(--accent);border-color:rgba(34,214,138,.28);background:rgba(34,214,138,.08)}
.badge.streak{color:var(--orange);border-color:rgba(255,138,61,.28);background:rgba(255,138,61,.08)}
.badge.time{color:var(--text2)}
.hdr-r .badge span.lbl{display:inline}
@media(max-width:560px){ .hdr-sub{display:none} .badge{padding:5px 9px;font-size:.74rem} }

/* progress */
.pbar-wrap{height:3px;background:var(--bg2);position:sticky;top:58px;z-index:399}
.pbar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s cubic-bezier(.2,.9,.3,1)}

/* nav dots */
.nav{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:12px 16px 4px;
}
.nav-dot{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);
  color:var(--text2);font-weight:800;font-size:.82rem;cursor:pointer;display:grid;place-items:center;
  transition:all .18s; position:relative
}
.nav-dot:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.nav-dot.active{background:var(--accent);color:#08120d;border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,214,138,.16)}
.nav-dot.done{border-color:rgba(34,214,138,.5);color:var(--accent)}
.nav-dot.done:after{content:'✓';position:absolute;top:-5px;right:-5px;font-size:.6rem;background:var(--accent);color:#08120d;width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.nav-dot.home{width:auto;padding:0 12px}

/* ============ LAYOUT ============ */
main{max-width:840px;margin:0 auto;padding:12px 16px 130px}
.screen{animation:fadeUp .38s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:8px}
h1{font-size:clamp(1.6rem,5.2vw,2.5rem);font-weight:900;letter-spacing:-.03em;line-height:1.1}
h2{font-size:1.22rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
h3{font-size:1rem;font-weight:800;margin-bottom:6px}
p{color:var(--text2)}
.lead{font-size:1.02rem;color:var(--text2);max-width:60ch}

/* ============ ACCUEIL ============ */
.hero{
  border:1px solid var(--border);border-radius:22px;padding:26px 22px;
  background:
    linear-gradient(150deg,rgba(34,214,138,.10),transparent 45%),
    linear-gradient(300deg,rgba(255,138,61,.09),transparent 50%),
    var(--card);
  position:relative;overflow:hidden
}
.hero:before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--border) 1px,transparent 1px);background-size:100% 34px;
  mask-image:linear-gradient(180deg,transparent,#000 70%,transparent);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 70%,transparent)
}
.hero>*{position:relative}
.hero h1 em{font-style:normal;color:var(--accent)}
.tw{
  display:grid;grid-template-columns:1fr 1fr;gap:0;margin:20px 0 4px;border:1px solid var(--border2);
  border-radius:14px;overflow:hidden;background:var(--bg3)
}
.tw>div{padding:12px 14px}
.tw>div:first-child{border-right:1px solid var(--border2)}
.tw .tw-h{font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.14em;color:var(--text3);margin-bottom:4px}
.tw .tw-v{font-weight:800;font-size:.92rem}
.tw .d{color:var(--debit)} .tw .c{color:var(--credit)}

.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:.85rem;color:var(--text2)}
.who .pill{background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-weight:600}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;
  border:1px solid transparent;font-weight:800;font-size:.94rem;cursor:pointer;transition:all .18s;
}
.btn-primary{background:var(--accent);color:#07130c;box-shadow:0 8px 22px rgba(34,214,138,.22)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(34,214,138,.3)}
.btn-ghost{background:transparent;border-color:var(--border2);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-acc{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn-acc:hover{background:var(--accent);color:#07130c}
.btn-org{background:transparent;border-color:var(--orange);color:var(--orange)}
.btn-org:hover{background:var(--orange);color:#180c04}
.btn-sm{padding:9px 15px;font-size:.83rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ============ HUB ============ */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px;margin-top:14px}
.lvl-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;text-align:left
}
.lvl-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.lvl-card .num{
  font-family:'Space Mono',monospace;font-size:.7rem;letter-spacing:.14em;color:var(--text3);font-weight:700
}
.lvl-card .ico{font-size:1.5rem;margin-bottom:6px;display:block}
.lvl-card h3{font-size:1.02rem;margin:2px 0 4px}
.lvl-card p{font-size:.8rem;line-height:1.45}
.lvl-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.75rem;color:var(--text3);font-weight:700}
.stars{letter-spacing:1px;font-size:.85rem}
.lvl-card.done{border-color:rgba(34,214,138,.42);background:linear-gradient(160deg,rgba(34,214,138,.07),var(--card) 60%)}
.lvl-card .tag{
  position:absolute;top:12px;right:12px;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  font-weight:800;padding:3px 8px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);color:var(--text3)
}
.lvl-card.done .tag{background:rgba(34,214,138,.14);border-color:rgba(34,214,138,.4);color:var(--accent)}

/* ============ THÉORIE ============ */
.theory{font-size:.93rem;color:var(--text2)}
.theory h3{color:var(--text);margin:20px 0 8px;font-size:1.03rem;display:flex;align-items:center;gap:8px}
.theory h3:first-child{margin-top:0}
.theory h4{color:var(--text);font-size:.9rem;margin:14px 0 5px;font-weight:700}
.theory p{margin-bottom:9px}
.theory b,.theory strong{color:var(--text);font-weight:700}
.theory .k{color:var(--accent);font-weight:700}
.theory ul{margin:0 0 10px 18px}
.theory li{margin-bottom:5px}
.theory code{font-family:'Space Mono',monospace;font-size:.85em;background:var(--bg3);border:1px solid var(--border);padding:1px 6px;border-radius:6px;color:var(--gold)}
.theory table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:.82rem}
.theory th{
  text-align:left;padding:8px 9px;background:var(--bg3);color:var(--text3);font-weight:800;
  font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid var(--border2)
}
.theory td{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:top}
.theory tr:last-child td{border-bottom:none}
.theory td b{color:var(--text)}
.theory .num-c{font-family:'Space Mono',monospace;color:var(--gold);white-space:nowrap}
.callout{
  border-radius:12px;padding:12px 14px;margin:12px 0;font-size:.87rem;border:1px solid;
  background:var(--bg3)
}
.callout .ct{font-weight:800;font-size:.72rem;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px;display:flex;gap:6px;align-items:center}
.c-note{border-color:rgba(77,171,247,.35);background:rgba(77,171,247,.07)} .c-note .ct{color:var(--blue)}
.c-warn{border-color:rgba(255,176,32,.35);background:rgba(255,176,32,.07)} .c-warn .ct{color:var(--warn)}
.c-key{border-color:rgba(34,214,138,.35);background:rgba(34,214,138,.07)} .c-key .ct{color:var(--accent)}
.c-ex{border-color:rgba(177,151,252,.32);background:rgba(177,151,252,.07)} .c-ex .ct{color:var(--purple)}

/* compte en T */
.tacc{border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:var(--bg3);margin:10px 0;font-size:.84rem}
.tacc-h{padding:7px 10px;font-weight:800;font-family:'Space Mono',monospace;font-size:.78rem;background:var(--bg2);border-bottom:1px solid var(--border2);color:var(--text)}
.tacc-b{display:grid;grid-template-columns:1fr 1fr;min-height:52px}
.tacc-b>div{padding:8px 10px}
.tacc-b>div:first-child{border-right:1px solid var(--border2)}
.tacc-s{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.1em;color:var(--text3);margin-bottom:4px}
.tacc-s.d{color:var(--debit)} .tacc-s.c{color:var(--credit)}
.tacc-l{font-family:'Space Mono',monospace;color:var(--text);font-size:.82rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

/* ============ QUESTIONS ============ */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qcount{font-family:'Space Mono',monospace;font-size:.74rem;color:var(--text3);letter-spacing:.08em}
.qtype{font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(177,151,252,.12);color:var(--purple);border:1px solid rgba(177,151,252,.3)}
.qpts{font-size:.72rem;color:var(--gold);font-weight:800}
.qtext{font-size:1.06rem;font-weight:600;color:var(--text);line-height:1.45;margin-bottom:6px}
.qsub{font-size:.85rem;color:var(--text2);margin-bottom:14px}
.qctx{
  background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--blue);
  border-radius:10px;padding:11px 13px;margin:0 0 14px;font-size:.86rem;color:var(--text2)
}
.qctx b{color:var(--text)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--border);background:var(--bg3);cursor:pointer;transition:all .16s;
  font-size:.92rem;text-align:left;color:var(--text);width:100%
}
.opt:hover:not(.locked){border-color:var(--border2);background:var(--bg2);transform:translateX(3px)}
.opt .mk{
  flex:0 0 22px;height:22px;border-radius:7px;border:1px solid var(--border2);display:grid;place-items:center;
  font-size:.7rem;font-weight:800;color:var(--text3);margin-top:1px
}
.opt.sel{border-color:var(--accent);background:rgba(34,214,138,.09)}
.opt.sel .mk{background:var(--accent);color:#07130c;border-color:var(--accent)}
.opt.good{border-color:var(--success);background:rgba(34,214,138,.14)}
.opt.good .mk{background:var(--success);color:#07130c;border-color:var(--success)}
.opt.bad{border-color:var(--error);background:rgba(255,77,109,.11)}
.opt.bad .mk{background:var(--error);color:#fff;border-color:var(--error)}
.opt.locked{cursor:default}
.opt.multi .mk{border-radius:50%}

/* numeric input */
.numwrap{margin:4px 0}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=text].nin,input[type=email].nin{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:12px 14px;border-radius:11px;
  font-family:'Space Mono',monospace;font-size:1rem;width:100%;max-width:230px;outline:none;transition:border-color .15s
}
input.nin:focus{border-color:var(--accent)}
input.nin.good{border-color:var(--success);background:rgba(34,214,138,.08)}
input.nin.bad{border-color:var(--error);background:rgba(255,77,109,.07)}
.unit{color:var(--text3);font-weight:800;font-family:'Space Mono',monospace}
.calc{font-family:'Space Mono',monospace;font-size:.78rem;color:var(--gold);margin-top:6px;min-height:1.1em}

/* classify */
.pool{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:var(--bg3);border:1px dashed var(--border2);border-radius:12px;min-height:56px;margin-bottom:12px}
.pool:empty:after{content:'Tous les éléments sont classés ✓';color:var(--text3);font-size:.82rem}
.chip{
  padding:7px 12px;border-radius:9px;background:var(--bg2);border:1px solid var(--border2);
  font-size:.83rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text)
}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.chip.sel{background:var(--accent);color:#07130c;border-color:var(--accent)}
.chip.good{border-color:var(--success);background:rgba(34,214,138,.16);color:var(--success)}
.chip.bad{border-color:var(--error);background:rgba(255,77,109,.14);color:var(--error);text-decoration:line-through}
.chip .fx{opacity:.65;font-size:.75em;margin-left:5px}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bucket{border:1px solid var(--border);border-radius:12px;background:var(--bg3);padding:10px;min-height:96px;cursor:pointer;transition:all .16s}
.bucket:hover{border-color:var(--accent)}
.bucket-h{font-size:.7rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--text3);margin-bottom:8px;display:flex;justify-content:space-between}
.bucket-items{display:flex;flex-wrap:wrap;gap:6px}
.bucket.b0{border-top:3px solid var(--debit)} .bucket.b0 .bucket-h{color:var(--debit)}
.bucket.b1{border-top:3px solid var(--credit)} .bucket.b1 .bucket-h{color:var(--credit)}
.bucket.b2{border-top:3px solid var(--purple)} .bucket.b2 .bucket-h{color:var(--purple)}
.bucket.b3{border-top:3px solid var(--gold)} .bucket.b3 .bucket-h{color:var(--gold)}

/* match */
.match-row{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;margin-bottom:8px}
.match-l{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.86rem;font-weight:600}
.match-arrow{color:var(--text3);font-size:.9rem}
select.msel{
  background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 11px;border-radius:10px;
  font-family:inherit;font-size:.86rem;width:100%;outline:none;cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:32px
}
select.msel:focus{border-color:var(--accent)}
select.msel.good{border-color:var(--success);background-color:rgba(34,214,138,.08)}
select.msel.bad{border-color:var(--error);background-color:rgba(255,77,109,.07)}
@media(max-width:520px){.match-row{grid-template-columns:1fr;gap:4px}.match-arrow{display:none}.match-row{margin-bottom:12px}}

/* fill */
.filltext{font-size:.95rem;line-height:2.35;color:var(--text2)}
.filltext b{color:var(--text)}
select.fsel{
  background:var(--bg3);border:1px solid var(--accent);color:var(--accent);padding:5px 8px;border-radius:8px;
  font-family:'Space Mono',monospace;font-size:.82rem;outline:none;cursor:pointer;font-weight:700;max-width:230px
}
select.fsel.good{border-color:var(--success);color:var(--success);background:rgba(34,214,138,.1)}
select.fsel.bad{border-color:var(--error);color:var(--error);background:rgba(255,77,109,.08)}

/* table question */
.qtable-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--bg3);-webkit-overflow-scrolling:touch}
table.qtable{width:100%;border-collapse:collapse;font-size:.85rem;min-width:420px}
table.qtable th{
  padding:9px 10px;text-align:left;background:var(--bg2);color:var(--text3);font-size:.66rem;
  letter-spacing:.1em;text-transform:uppercase;font-weight:800;border-bottom:1px solid var(--border2);white-space:nowrap
}
table.qtable tr.rgood{background:rgba(34,214,138,.09)}
table.qtable tr.rbad{background:rgba(255,77,109,.07)}
table.qtable tr.rgood td:first-child{box-shadow:inset 3px 0 0 var(--success)}
table.qtable tr.rbad td:first-child{box-shadow:inset 3px 0 0 var(--error)}
.sol-lbl{font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;font-weight:800;color:var(--text3);margin:14px 0 6px}
.was{color:var(--error);text-decoration:line-through}
.fix{color:var(--success);font-weight:700}
table.qtable th.hd{color:var(--debit)}
table.qtable th.hc{color:var(--credit)}
table.qtable td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
table.qtable tr:last-child td{border-bottom:none}
table.qtable .fixed{color:var(--text);font-weight:600}
table.qtable .fixed.mono{color:var(--gold)}
table.qtable input.cin{
  background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:8px 9px;border-radius:8px;
  font-family:'Space Mono',monospace;font-size:.84rem;width:100%;min-width:92px;outline:none;text-align:right
}
table.qtable input.cin:focus{border-color:var(--accent)}
table.qtable input.cin.good,table.qtable select.csel.good{border-color:var(--success);background:rgba(34,214,138,.1)}

<script>
/* ============================================================
   PARTIE 1 — CONFIGURATION & ÉTAT
   ============================================================ */
const TRACKING = {
  appName: "Compta — Module 0 : Bilan, PCMN & TVA",
  totalNiveaux: 7,
  sessionId: null,
  scriptUrl: "https://script.google.com/macros/s/AKfycbx9bRMVuHU2mgFLii1KcQXD3LdZahnDH1rf1cWv9RuDvQAt0l3VtLtxzmbH7MtpJWRjfA/exec"
};

const APP = {
  email: localStorage.getItem('student_email') || '',
  classe: localStorage.getItem('student_classe') || '',
  score: 0,
  streak: 0,
  bestStreak: 0,
  current: 0,           // 0 = hub, 1..7 = niveau
  qIndex: 0,
  completed: new Set(),
  completedExercises: [],
  levelStats: {},       // idx -> {first, second, shown, pts, max}
  exerciseStartTime: null,
  exerciseTimes: {},
  exerciseScores: {},
  scoreBeforeExercise: 0,
  globalTimerStart: null,
  globalTimerInterval: null
};

let QSTATE = {};

/* ============================================================
   PARTIE 2 — CONTENU PÉDAGOGIQUE
   ============================================================ */
const LEVELS = [
/* ---------------------------------------------------------- NIVEAU 1 */
{
  id:1, icon:'🧩', title:'Le grand tri',
  sub:'Bilan ou compte de résultats ? Actif ou passif ?',
  goal:'Reconstituer par toi-même la structure des deux grands documents comptables.',
  theory:`
<h3>📸 Deux documents, deux logiques</h3>
<p>Toute la comptabilité générale tient dans <b>deux tableaux</b>. Les confondre, c'est se tromper de raisonnement dès la première écriture.</p>
<table>
  <tr><th></th><th>Le bilan</th><th>Le compte de résultats</th></tr>
  <tr><td><b>Image</b></td><td>Une <b>photo</b> 📸</td><td>Un <b>film</b> 🎬</td></tr>
  <tr><td><b>Quand&nbsp;?</b></td><td>À une <b>date</b> précise (31/12)</td><td>Sur une <b>période</b> (l'exercice)</td></tr>
  <tr><td><b>Quoi&nbsp;?</b></td><td>Le <b>patrimoine</b> : ce qu'on a, ce qu'on doit</td><td>L'<b>activité</b> : ce qui coûte, ce qui rapporte</td></tr>
  <tr><td><b>Colonnes</b></td><td>ACTIF / PASSIF</td><td>CHARGES / PRODUITS</td></tr>
</table>

<h3>⚖️ Le bilan : emplois à gauche, ressources à droite</h3>
<p>La question à se poser n'est pas « où je mets ça&nbsp;? » mais <b>« est-ce un bien que je possède, ou l'origine de l'argent qui l'a financé&nbsp;? »</b></p>
<div class="tw">
  <div><div class="tw-h">ACTIF — EMPLOIS</div><div class="tw-v d">Ce que l'entreprise <b>possède</b> et ce qu'on lui <b>doit</b></div>
  <p style="font-size:.82rem;margin-top:6px">Bâtiments, machines, stocks, créances sur les clients, argent en banque et en caisse.</p></div>
  <div><div class="tw-h">PASSIF — RESSOURCES</div><div class="tw-v c">D'<b>où vient</b> l'argent</div>
  <p style="font-size:.82rem;margin-top:6px">Apport des associés, réserves, bénéfice reporté, subsides, provisions, dettes envers les banques, fournisseurs, le fisc, l'ONSS…</p></div>
</div>
<div class="callout c-key"><div class="ct">🔑 Règle d'or</div>
TOTAL ACTIF = TOTAL PASSIF, <b>toujours</b>. Chaque euro placé quelque part (actif) vient forcément de quelque part (passif).</div>

<h3>🎬 Le compte de résultats : ce qui coûte, ce qui rapporte</h3>
<ul>
  <li><b>CHARGES</b> (classe 6) : achats de marchandises, services et biens divers, rémunérations, amortissements, autres charges d'exploitation, charges financières, impôts sur le résultat.</li>
  <li><b>PRODUITS</b> (classe 7) : ventes et prestations, produits financiers, produits non récurrents, régularisations d'impôts.</li>
</ul>
<p>PRODUITS − CHARGES = <b class="k">RÉSULTAT</b> (bénéfice si positif, perte si négatif).</p>

<div class="callout c-warn"><div class="ct">⚠️ Piège classique</div>
Certains intitulés ne sont <b>pas des rubriques</b> mais des <b>titres de sections</b>, c'est-à-dire des <b>résultats intermédiaires calculés</b> : « Résultat d'exploitation », « Résultat brut avant impôts », « Résultat net de l'exercice (à affecter) ». On ne peut rien « ranger » dedans : ce sont des soustractions.</div>

<div class="callout c-ex"><div class="ct">🔎 Exemple — HAIR STYLE</div>
Deux associés créent le salon HAIR STYLE et versent <b>20.000&nbsp;€</b> sur le compte bancaire de la société. Bilan de départ&nbsp;:
<div class="tw" style="margin-top:10px">
  <div><div class="tw-h">ACTIF</div><div class="tw-v">IX. Valeurs disponibles <span class="num-c">20.000</span></div></div>
  <div><div class="tw-h">PASSIF</div><div class="tw-v">I. Apport <span class="num-c">20.000</span></div></div>
</div>
L'argent est <b>à l'actif</b> (le compte en banque est un bien de l'entreprise) et son <b>origine au passif</b> (l'entreprise le doit aux associés). Pas encore la moindre charge ni le moindre produit&nbsp;: aucune activité n'a démarré.</div>
`,
  questions:[
  {t:'classify', pts:16,
   q:'Range chaque rubrique du côté où elle figure au bilan.',
   sub:'Clique un terme, puis clique la colonne. Tu peux le ressortir en le recliquant.',
   buckets:['ACTIF','PASSIF'],
   items:[
     {x:'Immobilisations incorporelles',b:0},{x:'Immobilisations corporelles',b:0},
     {x:'Immobilisations financières',b:0},{x:"Frais d'établissement",b:0},
     {x:'Stocks',b:0},{x:'Créances à un an au plus',b:0},
     {x:"Créances à plus d'un an",b:0},{x:'Valeurs disponibles',b:0},
     {x:'Capital (SA)',b:1},{x:'Apport hors capital (SRL/SC)',b:1},
     {x:'Réserves',b:1},{x:'Résultats reportés',b:1},
     {x:'Provisions',b:1},{x:"Dettes à plus d'un an",b:1},
     {x:'Dettes commerciales',b:1},{x:'Dettes fiscales, salariales et sociales',b:1}
   ],
   hint:"Pose-toi une seule question pour chaque terme : « est-ce une chose que l'entreprise possède ou qu'on lui doit ? » Si oui → actif. Si c'est de l'argent qu'elle a reçu ou qu'elle doit rendre → passif. Attention : le mot « créance » et le mot « dette » ne sont pas du même côté.",
   ex:"À l'actif, tout ce qui est <b>emploi</b> des fonds : immobilisations (incorporelles, corporelles, financières), frais d'établissement, stocks, créances (l'argent que les <b>clients</b> me doivent) et valeurs disponibles. Au passif, l'<b>origine</b> des fonds : capitaux propres (capital ou apport, réserves, résultats reportés), provisions et toutes les dettes."},

  {t:'classify', pts:14,
   q:'Même exercice, cette fois pour le compte de résultats.',
   buckets:['CHARGES','PRODUITS'],
   items:[
     {x:'Approvisionnements',b:0},{x:'Services et biens divers',b:0},
     {x:'Rémunérations',b:0},{x:'Amortissements, réductions de valeur et provisions',b:0},
     {x:'Charges autres',b:0},{x:'Charges financières',b:0},{x:'Charges fiscales',b:0},
     {x:'Ventes et prestations',b:1},{x:'Produits financiers',b:1},{x:'Produits fiscaux',b:1}
   ],
   hint:"Ici le vocabulaire t'aide énormément : le mot lui-même contient presque toujours la réponse. Relis chaque terme à voix basse et demande-toi : est-ce que ça fait sortir de l'argent, ou entrer de l'argent ?",
   ex:"Les charges appauvrissent l'entreprise (classe 6), les produits l'enrichissent (classe 7). « Approvisionnements » = les achats de marchandises et de matières premières. « Charges fiscales » = les impôts sur le résultat (67), et son symétrique « Produits fiscaux » = les régularisations d'impôts (77)."},

  {t:'multi', pts:10,
   q:'Trois de ces intitulés ne sont pas des rubriques : ce sont des titres de sections, des résultats calculés. Lesquels ?',
   opts:['Résultat d\'exploitation','Stocks','Résultat brut avant impôts','Rémunérations','Résultat net de l\'exercice (à affecter)','Subsides'],
   a:[0,2,4],
   hint:"Une rubrique, on peut y ranger un compte du plan comptable. Un titre de section, non : il se calcule par une addition ou une soustraction. Cherche les intitulés qui commencent tous par le même mot.",
   ex:"Résultat d'exploitation = Ventes et prestations − Charges d'exploitation. Résultat brut avant impôts = Résultat d'exploitation + Produits financiers − Charges financières. Résultat net à affecter = ce qui reste après impôts. Aucun compte du PCMN ne s'y range directement : ce sont des <b>lignes de total</b>."},

  {t:'multi', pts:10,
   q:'Parmi ces rubriques, lesquelles figurent au PASSIF du bilan ?',
   opts:['Subsides en capital','Plus-values de réévaluation','Dettes financières à un an au plus','Placements de trésorerie','Stocks et commandes en cours'],
   a:[0,1,2],
   hint:"Deux d'entre elles ressemblent à des « biens » mais n'en sont pas : un subside est une somme qu'on a reçue, une plus-value de réévaluation est une richesse propre à l'entreprise. Où loge la richesse qui appartient aux associés ?",
   ex:"Subsides en capital (15) et plus-values de réévaluation (12) font partie des <b>capitaux propres</b> : passif. Les dettes financières à un an au plus (43) sont évidemment au passif. En revanche, les placements de trésorerie (50-53) et les stocks (30-37) sont des biens : actif."},

  {t:'qcm', pts:8,
   q:"L'entreprise achète une machine de 12.000 € et ne la paie pas tout de suite. Que se passe-t-il au bilan ?",
   opts:[
     "Seul l'actif augmente de 12.000 € : l'entreprise possède la machine.",
     "L'actif augmente de 12.000 € (la machine) ET le passif augmente de 12.000 € (la dette au fournisseur).",
     "Seul le passif augmente de 12.000 € : c'est une dette.",
     "Rien ne bouge tant que la facture n'est pas payée."],
   a:1,
   hint:"Relis la règle d'or : total actif = total passif, en permanence. Si un seul côté bougeait, l'égalité serait rompue. Alors, d'où vient l'argent qui a financé cette machine ?",
   ex:"L'entreprise a un bien de plus (la machine, <b>actif +12.000</b>) financé par une ressource nouvelle : le crédit accordé par le fournisseur (<b>passif +12.000</b>). L'équilibre est conservé. C'est exactement le mécanisme de l'écriture 2300 / 4400 que tu verras au niveau 6."},

  {t:'vf', pts:6,
   q:"« Le bilan décrit une période, tandis que le compte de résultats décrit une date précise. »",

<p>Le bilan n'est pas libre : son modèle est fixé par l'<b>arrêté royal du 29 avril 2019</b> portant exécution du Code des sociétés et des associations (« AR CSA »). Il comporte <b>dix rubriques à l'actif</b> et <b>dix au passif</b>.</p>

<h4>Les rubriques du passif et leur classe</h4>
<table>
<tr><th>N°</th><th>Rubrique du passif</th><th>Comptes</th></tr>
<tr><td><b>I.</b></td><td>Apport — A. Capital (SA) · A. Apport disponible / B. Apport indisponible (SRL, SC)</td><td class="num-c">10 (SA) · 11 (SRL/SC)</td></tr>

<tr><td><b>X.</b></td><td>Comptes de régularisation</td><td class="num-c">49</td></tr>

<div class="tw">
  <div><div class="tw-h">ACTIF</div>

  <div><div class="tw-h">PASSIF</div>
  <div style="font-size:.85rem;line-height:1.9">I. Apport<br>III. Réserves<br>VIII. Dettes à plus d'un an<br>IX. Dettes à un an au plus</div></div>

<h3>📦 Ce que contient chaque rubrique</h3>
<ul>

<li><b>Créances à un an au plus</b> : ce que les clients — et tout autre débiteur (associé, fisc) — doivent à l'entreprise, échéance dans les 12 mois.</li>
<li><b>Valeurs disponibles</b> : les sommes liquides, en compte bancaire et en caisse.</li>
<li><b>Réserves</b> : un prolongement de l'apport, constitué de bénéfices <b>non distribués</b> aux associés.</li>
<li><b>Dettes</b> : envers les banquiers, fournisseurs, le fisc, la TVA, le personnel — classées à <b>plus d'un an</b> (long terme) et à <b>un an au plus</b> (court terme).</li>

<h3>⚡ Mise à jour 2026 — la réforme CSA</h3>
<p>Depuis l'entrée en vigueur du CSA le <b>1<sup>er</sup> mai 2019</b>, le droit belge distingue deux familles :</p>

{
  id:3, icon:'🎬', title:'Le compte de résultats',
  sub:'Des ventes au bénéfice : la cascade des résultats',
  goal:'Suivre la construction du résultat, rubrique par rubrique, et classer correctement une charge.',
  theory:`
<h3>🎬 Confronter les produits et les charges</h3>
<p>Le compte de résultats confronte, sur la durée d'un exercice comptable, les <b>produits</b> (ce que l'activité rapporte) et les <b>charges</b> (ce qu'elle coûte). La différence donne le <b>résultat</b>.</p>

<table>
<tr><th>N°</th><th>Rubrique</th><th>Signe</th><th>Classe</th></tr>
<tr><td><b>I.</b></td><td>VENTES ET PRESTATIONS (chiffre d'affaires)</td><td style="color:var(--accent)">+</td><td class="num-c">70 – 74</td></tr>
<tr><td><b>II.</b></td><td>CHARGES D'EXPLOITATION (coût des ventes)</td><td style="color:var(--error)">−</td><td class="num-c">60 – 64</td></tr>
<tr><td></td><td style="padding-left:18px">A. approvisionnements — 1. achats · 2. variation de stock</td><td></td><td class="num-c">60</td></tr>
<tr><td></td><td style="padding-left:18px">B. services et biens divers (SBD = frais généraux)</td><td></td><td class="num-c">61</td></tr>
<tr><td></td><td style="padding-left:18px">C. rémunérations et charges sociales</td><td></td><td class="num-c">62</td></tr>
<tr><td></td><td style="padding-left:18px">D, E &amp; F. amortissements, réductions de valeur et provisions</td><td></td><td class="num-c">63</td></tr>
<tr><td></td><td style="padding-left:18px">G. autres charges d'exploitation</td><td></td><td class="num-c">64</td></tr>
<tr><td><b>III.</b></td><td><b>RÉSULTAT D'EXPLOITATION (= I − II)</b></td><td></td><td></td></tr>
<tr><td><b>IV.</b></td><td>PRODUITS FINANCIERS</td><td style="color:var(--accent)">+</td><td class="num-c">75</td></tr>
<tr><td><b>V.</b></td><td>CHARGES FINANCIÈRES</td><td style="color:var(--error)">−</td><td class="num-c">65</td></tr>
<tr><td><b>VI.</b></td><td><b>RÉSULTAT AVANT IMPÔTS (= III + IV − V)</b></td><td></td><td></td></tr>
<tr><td><b>VII.</b></td><td>IMPÔTS SUR LE RÉSULTAT</td><td style="color:var(--error)">−</td><td class="num-c">67 – 77</td></tr>
<tr><td><b>VIII.</b></td><td><b>RÉSULTAT DE L'EXERCICE (= VI − VII)</b></td><td></td><td></td></tr>
</table>

<h3>💶 Le contenu des principales rubriques</h3>
<ul>
<li>Le <b>chiffre d'affaires (CA)</b> est le total <b>HTVA</b> des ventes et prestations. Surtout ne pas confondre CA et <b>recettes</b> (l'argent effectivement encaissé), ni CA et <b>bénéfice</b> (ce qui reste après toutes les charges).</li>
<li>Les <b>achats</b> (HTVA) concernent les matières premières et les marchandises.</li>
<li>Les <b>frais généraux ou SBD</b> (services et biens divers, HTVA, compte 61) : loyer des bâtiments professionnels et entretien courant, entretien du matériel, électricité-chauffage-eau, frais de bureau-téléphone-courrier, déplacements, publicité, frais de réception et de représentation, honoraires des tiers (comptable, avocat), assurances…</li>
<li>Les <b>rémunérations et charges sociales</b> (62) : salaires, primes et avantages versés au personnel, plus les cotisations de sécurité sociale (ONSS, assurance-loi) payées par l'employeur.</li>
<li>Les <b>amortissements</b> (63) : la prise en charge de l'<b>usure</b> de l'immobilisé.</li>
<li>Les <b>autres charges d'exploitation</b> (64) : les taxes <b>non liées au résultat</b> (taxes communales), les amendes…</li>
<li>Les <b>charges financières</b> (65) : intérêts payés sur les emprunts, frais bancaires, escomptes accordés.</li>
<li>Les <b>charges non récurrentes</b> (66) : par exemple une perte liée à un vol ou à un accident non couvert par une assurance.</li>
</ul>

<div class="callout c-warn"><div class="ct">⚡ Mise à jour 2026</div>
Depuis l'<b>arrêté royal du 18 décembre 2015</b>, le résultat exceptionnel a <b>disparu</b> du compte de résultats. On ne parle plus de produits et charges « exceptionnels » mais de <b>produits non récurrents (76)</b> et <b>charges non récurrentes (66)</b>, rattachés soit au résultat d'exploitation, soit au résultat financier. Les anciennes rubriques VII et VIII ont été supprimées et l'ancien « IX. Résultat brut » est devenu « VI. Bénéfice (perte) de l'exercice avant impôts ». Le terme officiel est d'ailleurs « <b>bénéfice (perte)</b> » ; « résultat » reste employé au cours par commodité.</div>

<div class="callout c-ex"><div class="ct">🔎 Exemple chiffré</div>
Une PME réalise 250.000 € de ventes. Ses achats s'élèvent à 120.000 €, ses SBD à 35.000 €, ses rémunérations à 60.000 € et ses amortissements à 12.000 €. Elle encaisse 500 € d'intérêts et paie 3.500 € d'intérêts d'emprunt. L'impôt s'élève à 5.000 €.
<div style="font-family:'Space Mono',monospace;font-size:.8rem;line-height:2;margin-top:8px">
III. Résultat d'exploitation = 250.000 − (120.000+35.000+60.000+12.000) = <span class="num-c">23.000</span><br>
VI. Résultat avant impôts = 23.000 + 500 − 3.500 = <span class="num-c">20.000</span><br>
VIII. Résultat de l'exercice = 20.000 − 5.000 = <span class="num-c">15.000</span></div>
Note bien : le chiffre d'affaires est de 250.000 € mais le bénéfice n'est que de 15.000 €. Confondre les deux, c'est se tromper d'un facteur 16.</div>

<h3>🔗 Du compte comptable au PCMN</h3>
<p>Tous les éléments du bilan et du compte de résultats sont identifiés par un <b>compte comptable</b> (ex. : <code>5500 Banque</code>). L'ensemble de ces comptes est repris dans un <b>plan comptable</b>. En Belgique, sa structure est imposée : c'est le <b>PCMN</b>, plan comptable minimum normalisé (AR du 21 octobre 2018).</p>
<p>Le PCMN fait mieux que numéroter : il précise aussi la <b>position</b> de chaque compte dans le bilan ou le compte de résultats.</p>
<ul>
<li><code>2400 Mobilier → A.III.C</code> signifie : le solde (débiteur) du compte mobilier sera repris à l'<b>A</b>ctif, rubrique <b>III</b> Immobilisations corporelles, sous-rubrique <b>C</b> mobilier et matériel roulant.</li>
<li><code>6040 Achats de marchandises → R.II.A.1</code> signifie : <b>R</b>ésultat, rubrique <b>II</b> coût des ventes, <b>A</b> approvisionnements, <b>1</b> achats.</li>

<h3>📕 Qu'est-ce qu'un compte ?</h3>

<div class="callout c-note"><div class="ct">ℹ️ Rappel absolu</div>

LES AUGMENTATIONS SONT INSCRITES <b>DU CÔTÉ OÙ SE TROUVE LE COMPTE</b> DANS LE DOCUMENT (bilan ou compte de résultats).</div>

<h3>🧭 Synthèse : quatre catégories, deux schémas</h3>
<table>
<tr><th>Comptes</th><th>Débités</th><th>Crédités</th></tr>

<tr><td><b>de passif</b> et <b>de produit</b></td><td style="color:var(--error)">des DIMINUTIONS −</td><td style="color:var(--accent)">des AUGMENTATIONS +</td></tr>
</table>
<p>Formulé autrement : les comptes d'<b>actif</b> et de <b>charge</b> sont <b>DÉBITEURS</b> ; les comptes de <b>passif</b> et de <b>produit</b> sont <b>CRÉDITEURS</b>.</p>

<div class="tacc"><div class="tacc-h">4400 FOURNISSEURS (passif)</div><div class="tacc-b">
<div><div class="tacc-s d">D −</div><div style="font-size:.78rem">↘ diminution</div></div>
<div><div class="tacc-s c">C +</div><div style="font-size:.78rem">↗ augmentation</div></div></div></div>
</div></div>

<h3>⚖️ La règle de l'équilibre</h3>
<div class="callout c-key"><div class="ct">🔑 Partie double</div>
QUAND ON DÉBITE UN COMPTE, IL FAUT EN CRÉDITER UN (OU PLUSIEURS) AUTRE(S) DU MÊME MONTANT, DE MANIÈRE À CE QUE LES DÉBITS ÉGALENT TOUJOURS LES CRÉDITS.</div>

<div class="callout c-ex"><div class="ct">🔎 Exemple — HAIR STYLE, ouverture des comptes</div>

&nbsp;&nbsp;&nbsp;à 1000 Capital&nbsp;&nbsp;<span class="num-c">20.000</span><br>

La banque (actif) augmente → débit. Le capital (passif) augmente → crédit. D 20.000 = C 20.000.</div>

{

  theory:`
<h3>🧾 La déclaration TVA périodique</h3>
<p>La TVA est un <b>impôt sur la consommation</b>. L'entreprise assujettie la perçoit <b>pour l'État</b> sur ses ventes (TVA due) et récupère celle qu'elle a payée à ses fournisseurs (TVA déductible). Chaque trimestre (ou chaque mois), elle établit une <b>déclaration périodique</b> — déposée par voie électronique via l'application <b>Intervat</b> du <b>SPF Finances</b> — et verse la différence à l'État, ou en obtient le remboursement.</p>
<div class="callout c-key"><div class="ct">🔑 Neutralité</div>
Pour l'entreprise assujettie, la TVA est <b>neutre</b> : elle ne l'enrichit ni ne l'appauvrit. Elle n'est qu'un intermédiaire entre le consommateur final et l'État. C'est pourquoi elle n'apparaît jamais en classe 6 ou 7, mais toujours en classe 4.</div>

<table>
<tr><th>Cadre</th><th>Contenu</th><th>Grilles principales</th></tr>
<tr><td><b>I</b></td><td>Renseignements généraux (identification de l'assujetti, période)</td><td>—</td></tr>
<tr><td><b>II</b></td><td>Opérations à la <b>sortie</b> (ventes)</td><td class="num-c">00 · 01 · 02 · 03 · 44 à 49</td></tr>
<tr><td><b>III</b></td><td>Opérations à l'<b>entrée</b> (achats)</td><td class="num-c">81 · 82 · 83 · 84 à 88</td></tr>
<tr><td><b>IV</b></td><td>Taxes <b>dues</b></td><td class="num-c">54 · 55 · 56 · 57 · 61 · 63</td></tr>
<tr><td><b>V</b></td><td>Taxes <b>déductibles</b></td><td class="num-c">59 · 62 · 64</td></tr>
<tr><td><b>VI</b></td><td><b>Solde</b></td><td class="num-c">71 = à payer · 72 = à récupérer</td></tr>
</table>
<div class="callout c-key"><div class="ct">🔑 Le réflexe du solde</div>
SI Σ TVA DÉDUCTIBLE &gt; Σ TVA DUE ► <b>GRILLE 72</b> (l'État te doit)<br>SINON ► <b>GRILLE 71</b> (tu dois payer)</div>

<div class="callout c-ex"><div class="ct">🔎 Exemple — déclaration du 1er trimestre (janvier à mars)</div>
Sur la base des trois écritures du niveau 6 : achat de marchandises 1.000 € (TVA 210), achat d'une machine 5.000 € (TVA 1.050), vente 2.000 € au taux de 6 % (TVA 120).
<table style="margin-top:6px">
<tr><th>Cadre</th><th>Grille</th><th>Libellé</th><th>Montant</th></tr>
<tr><td>II</td><td class="num-c">01</td><td>Ventes au taux de 6 %</td><td class="num-c">2.000,00</td></tr>
<tr><td>III</td><td class="num-c">81</td><td>Achats de marchandises</td><td class="num-c">1.000,00</td></tr>
<tr><td>III</td><td class="num-c">83</td><td>Achats de biens d'investissement</td><td class="num-c">5.000,00</td></tr>
<tr><td>IV</td><td class="num-c">54</td><td>TVA due sur les ventes</td><td class="num-c">120,00</td></tr>
<tr><td>V</td><td class="num-c">59</td><td>TVA déductible (210 + 1.050)</td><td class="num-c">1.260,00</td></tr>
<tr><td>VI</td><td class="num-c">72</td><td><b>Somme due par l'État</b> (1.260 − 120)</td><td class="num-c"><b>1.140,00</b></td></tr>
</table>
<p style="font-size:.83rem">Les grilles 81 et 83 reçoivent les montants <b>HTVA</b> ; les grilles 54 et 59 reçoivent les <b>montants de TVA</b>. Ne mélange jamais les deux.</p></div>

<h3>🔒 Clôturer l'exercice</h3>
<h4>1. Calculer les soldes</h4>
<ul>
<li><b>Comptes d'actif</b> : différence entre ΣD+ et ΣC− → <b>solde débiteur (SD)</b>.</li>
<li><b>Comptes de passif</b> : différence entre ΣC+ et ΣD− → <b>solde créditeur (SC)</b>.</li>
</ul>

<h4>2. Établir la balance de vérification (balance par soldes)</h4>
<p>Reprenons HAIR STYLE : apport 20.000 € (0), facture matériel 8.000 € + mobilier 3.500 € (1), paiement du fournisseur 11.500 € (2).</p>
<table>

<tr><td>5500 Banque CC</td><td class="num-c">8.500</td><td></td></tr>

</table>
<div class="callout c-warn"><div class="ct">⚠️ Obligatoirement</div>

<h4>3. Dresser le bilan final</h4>
<p>À partir de la balance, on consulte dans le PCMN la position de chaque compte :</p>
<table>
<tr><th>Compte</th><th>Solde</th><th>Position au bilan</th></tr>
<tr><td>1000 Capital</td><td>SC</td><td>P.I.</td></tr>
<tr><td>2300 Matériel</td><td>SD</td><td>A.III.B.</td></tr>
<tr><td>2400 Mobilier</td><td>SD</td><td>A.III.C.</td></tr>
<tr><td>5500 Banque</td><td>SD</td><td>A.IX.</td></tr>
</table>
<div class="tw">
  <div><div class="tw-h">ACTIF</div><div style="font-size:.83rem;line-height:1.85">
  III. Immobilisations corporelles <span class="num-c">11.500</span><br>
  <span style="padding-left:12px">B. IMO <span class="num-c">8.000</span></span><br>
  <span style="padding-left:12px">C. mobilier <span class="num-c">3.500</span></span><br>
  IX. Valeurs disponibles <span class="num-c">8.500</span><br><b>TOTAL <span class="num-c">20.000</span></b></div></div>
  <div><div class="tw-h">PASSIF</div><div style="font-size:.83rem;line-height:1.85">
  I. Apport (capital) <span class="num-c">20.000</span><br><br><br><br><b>TOTAL <span class="num-c">20.000</span></b></div></div>
</div>
<p style="font-size:.83rem">Remarque : cet exemple ne comportait que des opérations <b>patrimoniales</b> — ni charges ni produits — donc pas de compte de résultats.</p>

<h3>🔍 Interpréter les comptes de bilan</h3>
<p>Les comptes de bilan sont dits « <b>de stock</b> » : leur solde donne à tout moment la valeur du patrimoine. Attention toutefois aux opérations de fin d'exercice. Si tu consultes les comptes au <b>15 juin</b> :</p>
<ul>
<li>le solde du compte <b>CLIENTS</b> donne bien la situation à cette date : les factures et paiements sont enregistrés au jour le jour ;</li>
<li>le solde du compte <b>CAISSE</b> te dit combien d'argent il y a ce 15 juin ; <b>MAIS</b></li>
<li>en l'absence d'inventaire permanent, le solde du compte <b>STOCK</b> est celui du <b>dernier inventaire</b> (fin décembre !) : il ne dit rien du stock réel au 15 juin ;</li>
<li>de même, la valeur du <b>MOBILIER</b> est celle de la fin de l'année précédente.</li>
</ul>

/* ============================================================
   PARTIE 3 — UTILITAIRES
   ============================================================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function $(id){return document.getElementById(id);}

/* Format belge : 1.234,56 */
function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '';
  const neg=n<0; n=Math.abs(n);
  const s=(Math.round(n*100)/100).toFixed(2).split('.');
  const ent=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'')+ent+','+s[1];
}
/* Accepte virgule ET point, espaces, séparateurs de milliers */
function parseNum(v){
  if(v===null||v===undefined) return NaN;
  let s=String(v).trim().replace(/[\s\u00a0€]/g,'');
  if(s==='') return NaN;
  const hasC=s.indexOf(',')>-1, hasD=s.indexOf('.')>-1;
  if(hasC&&hasD){ s=s.replace(/\./g,'').replace(',','.'); }
  else if(hasC){ s=s.replace(',','.'); }
  const n=parseFloat(s);
  return isNaN(n)?NaN:n;
}
/* Mini-calculatrice : évalue une expression tapée par l'élève */
function tryCalc(v){
  if(!v) return null;
  let s=String(v).replace(/[\s\u00a0€]/g,'').replace(/×/g,'*').replace(/÷/g,'/');
  if(!/[+\-*/]/.test(s.slice(1))) return null;          // pas d'opérateur → pas un calcul
  if(!/^[0-9+\-*/().,%]+$/.test(s)) return null;
  s=s.replace(/(\d),(\d)/g,'$1.$2');
  if(/%/.test(s)) s=s.replace(/%/g,'/100');
  try{ const r=Function('"use strict";return ('+s+')')(); return (typeof r==='number'&&isFinite(r))?r:null; }
  catch(e){ return null; }
}
function nearly(a,b,tol){ return Math.abs(a-b)<=(tol||0.02)+1e-9; }
function fmtTime(sec){ const m=Math.floor(sec/60),s=sec%60; return m>0? m+'m'+String(s).padStart(2,'0')+'s' : s+'s'; }

/* ============================================================
   PARTIE 4 — ÉTAT DES QUESTIONS (pré-mélange global)
   ============================================================ */
function initQuestionState(){
  QSTATE={};
  LEVELS.forEach((lv,li)=>{
    lv.questions.forEach((q,qi)=>{
      QSTATE[li+'_'+qi]=buildQState(q);
    });
  });
}
function buildQState(q){
  const st={attempts:0,status:null,ans:null,view:{}};
  if(q.t==='qcm'||q.t==='multi'){ st.view.order=shuffle(q.opts.map((_,i)=>i)); st.ans=(q.t==='multi')?[]:null; }
  if(q.t==='vf'){ st.ans=null; }
  if(q.t==='classify'){ st.view.items=shuffle(q.items.map((_,i)=>i)); st.ans=q.items.map(()=>null); }
  if(q.t==='match'){ st.view.left=shuffle(q.pairs.map((_,i)=>i)); st.view.right=shuffle(q.pairs.map(p=>p.r)); st.ans=q.pairs.map(()=>''); }
  if(q.t==='order'){ st.view.pool=shuffle(q.items.map((_,i)=>i)); st.ans=[]; }
  if(q.t==='fill'){ st.view.bank=shuffle(q.bank.slice()); st.ans=q.a.map(()=>''); }
  if(q.t==='table'){ st.ans=q.rows.map(r=>r.map(c=>'')); }
  if(q.t==='num'){ st.ans=''; }
  return st;
}

/* ---------- QCM / VRAI-FAUX ---------- */
qcm:function(q,st,locked){
  const order=st.view.order, letters='ABCDEF';
  let h='<div class="opts">';
  order.forEach((oi,pos)=>{
    let cls='opt';
    if(locked){ cls+=' locked'; if(oi===q.a) cls+=' good'; else if(st.ans===oi) cls+=' bad'; }
    else if(st.ans===oi) cls+=' sel';
    h+='<button class="'+cls+'"'+(locked?'':' onclick="pick('+oi+')"')+'>'
      +'<span class="mk">'+letters[pos]+'</span><span>'+q.opts[oi]+'</span></button>';
  });
  return h+'</div>';
},
vf:function(q,st,locked){
  let h='<div class="opts">';
  ['Vrai','Faux'].forEach((lab,i)=>{
    let cls='opt';
    if(locked){ cls+=' locked'; if(i===q.a) cls+=' good'; else if(st.ans===i) cls+=' bad'; }
    else if(st.ans===i) cls+=' sel';
    h+='<button class="'+cls+'"'+(locked?'':' onclick="pick('+i+')"')+'>'
      +'<span class="mk">'+(i===0?'V':'F')+'</span><span>'+lab+'</span></button>';
  });
  return h+'</div>';
},
multi:function(q,st,locked){
  const order=st.view.order;
  let h='<div class="qsub" style="margin-bottom:10px">Plusieurs réponses possibles.</div><div class="opts">';
  order.forEach(oi=>{
    const sel=st.ans.indexOf(oi)>-1, good=q.a.indexOf(oi)>-1;
    let cls='opt multi';
    if(locked){ cls+=' locked'; if(good) cls+=' good'; else if(sel) cls+=' bad'; }
    else if(sel) cls+=' sel';
    h+='<button class="'+cls+'"'+(locked?'':' onclick="pickMulti('+oi+')"')+'>'
      +'<span class="mk">'+(sel||(locked&&good)?'✓':'')+'</span><span>'+q.opts[oi]+'</span></button>';
  });
  return h+'</div>';

num:function(q,st,locked){
  if(locked){
    const ok=nearly(parseNum(st.ans),q.a,q.tol);
    return '<div class="numrow"><input class="nin '+(ok?'good':'bad')+'" value="'+esc(st.ans)+'" disabled>'
      +'<span class="unit">'+(q.unit||'')+'</span>'

    +'<input class="nin" id="numIn" inputmode="decimal" autocomplete="off" placeholder="0,00" value="'+esc(st.ans)+'" '
    +'oninput="setNum(this.value)" onkeydown="if(event.key===\'Enter\')checkAnswer()">'
    +'<span class="unit">'+(q.unit||'')+'</span></div>'
    +'<div class="calc" id="calcPrev"></div>'
    +'<div class="qsub" style="margin-top:6px">Virgule ou point acceptés. Tu peux aussi taper ton calcul (ex. : <code style="font-family:\'Space Mono\',monospace">2000*6/100</code>).</div></div>';
},
/* ---------- CLASSEMENT ---------- */
classify:function(q,st,locked){
  const disp=st.view.items;
  let pool='';
  disp.forEach(i=>{
    if(st.ans[i]!==null) return;
    pool+='<button class="chip'+(st.view.sel===i?' sel':'')+'"'+(locked?'':' onclick="chipPick('+i+')"')+'>'+esc(q.items[i].x)+'</button>';
  });
  let b='<div class="buckets">';
  q.buckets.forEach((name,bi)=>{
    let inner='',count=0;
    disp.forEach(i=>{
      if(st.ans[i]!==bi) return; count++;
      let cls='chip';
      if(locked) cls+=(q.items[i].b===bi?' good':' bad');
      const fx=(locked&&q.items[i].b!==bi)?'<span class="fx">→ '+esc(q.buckets[q.items[i].b])+'</span>':'';
      inner+='<button class="'+cls+'"'+(locked?'':' onclick="chipBack('+i+')"')+'>'+esc(q.items[i].x)+fx+'</button>';
    });
    b+='<div class="bucket b'+bi+'"'+(locked?'':' onclick="chipDrop('+bi+')"')+'>'
      +'<div class="bucket-h"><span>'+esc(name)+'</span><span>'+count+'</span></div>'
      +'<div class="bucket-items">'+inner+'</div></div>';
  });
  return (locked?'':'<div class="pool">'+pool+'</div>')+b+'</div>';
},
/* ---------- ASSOCIATION ---------- */
match:function(q,st,locked){
  let h='';
  st.view.left.forEach(i=>{
    const p=q.pairs[i], val=st.ans[i], ok=val===p.r;

    }else{
      let opts='<option value="">— choisir —</option>';
      st.view.right.forEach(r=>{ opts+='<option value="'+esc(r)+'"'+(val===r?' selected':'')+'>'+esc(r)+'</option>'; });
      h+='<div class="match-row"><div class="match-l">'+esc(p.l)+'</div><div class="match-arrow">→</div>'
        +'<select class="msel" onchange="setMatch('+i+',this.value)">'+opts+'</select></div>';
    }
  });
  return h;
},
/* ---------- TEXTE À TROUS ---------- */
fill:function(q,st,locked){
  let h='<div class="filltext">'+q.text.replace(/\{(\d+)\}/g,function(m,d){
    const i=parseInt(d,10), val=st.ans[i], ok=val===q.a[i];
    if(locked){
      if(ok) return '<span class="mono fix">'+esc(val||'…')+'</span>';
      return '<span class="mono was">'+esc(val||'…')+'</span>'
        +' <span class="mono fix">➜ '+esc(q.a[i])+'</span>';
    }
    let o='<option value="">…</option>';
    st.view.bank.forEach(w=>{ o+='<option value="'+esc(w)+'"'+(val===w?' selected':'')+'>'+esc(w)+'</option>'; });
    return '<select class="fsel" onchange="setFill('+i+',this.value)">'+o+'</select>';
  })+'</div>';
  return h;

  if(locked && q.anyOrder) return tableReview(q,st);

/* ---------- MISE EN ORDRE ---------- */
order:function(q,st,locked){

  st.view.pool.forEach(i=>{
    if(st.ans.indexOf(i)>-1) return;
    pool+='<button class="chip" onclick="orderAdd('+i+')">'+esc(q.items[i])+'</button>';
  });

    seq+='<div class="'+cls+'"'+(locked?'':' onclick="orderRemove('+pos+')"')+'>'
      +'<span class="rk">'+(pos+1)+'.</span><span>'+esc(q.items[i])+'</span></div>';
  });

    let sol='';

      +'<div class="qsub" style="margin:12px 0 6px">Ordre correct :</div><div class="order-seq">'+sol+'</div>';
  }
  return '<div class="order-pool">'+pool+'</div><div class="order-seq">'+seq+'</div>'
    +(st.ans.length?'<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="orderReset()">↺ Recommencer l\'ordre</button></div>':'');
}
};

/* --- Écritures : comparaison ligne par ligne, ordre indifférent --- */
function normTableRow(q,row,vals){
  const out=[];
  row.forEach((c,ci)=>{
    if(c.k==='txt'){ out.push('T:'+c.v); return; }
    if(c.k==='sel'||c.k==='sel2'){
      let v=String(vals[ci]==null?'':vals[ci]).trim();
      if(v===''||v==='—') v='—';
      out.push('S:'+v); return;
    }
    const calc=tryCalc(vals[ci]);
    const num = calc!==null ? calc : parseNum(vals[ci]);
    out.push('N:'+((isNaN(num)||num===0)?'':Math.round(num*100)));
  });
  return out.join('|');
}
function expectedSigs(q){
  return q.rows.map(r=>normTableRow(q,r,r.map(c=>c.k==='num'?(c.a===null?'':String(c.a)):(c.a==null?'':c.a))));
}
function matchTableRows(q,ans){
  const exp=expectedSigs(q), used=exp.map(()=>false), res=[];
  (ans||[]).forEach((vals,ri)=>{
    const sig=normTableRow(q,q.rows[ri]||q.rows[0],vals);
    let hit=false;
    for(let k=0;k<exp.length;k++){ if(!used[k]&&exp[k]===sig){ used[k]=true; hit=true; break; } }
    res.push(hit);
  });
  return {rows:res, ok:res.filter(Boolean).length, tot:q.rows.length};
}
function cellText(q,cell,val){
  if(cell.k==='txt') return esc(cell.v);
  if(cell.k==='sel'||cell.k==='sel2'){ const v=String(val||'').trim(); return esc(v===''?'—':v); }
  const calc=tryCalc(val); const num=calc!==null?calc:parseNum(val);
  return (isNaN(num)||num===0)?'—':fmt(num);
}

function cellHTML(q,st,cell,ri,ci,locked){
  const val=st.ans[ri][ci];
  if(cell.k==='txt') return '<span class="fixed">'+esc(cell.v)+'</span>';
  if(cell.k==='sel'||cell.k==='sel2'){
    const list=(cell.k==='sel'?q.selOpts:q.selOpts2)||[];
    const ok=(val||'')===cell.a || (cell.a==='—'&&(val===''||val==='—'));
    if(locked){
      return '<span class="mono" style="color:'+(ok?'var(--success)':'var(--error)')+'">'+esc(val||'—')+'</span>'
        +(ok?'':'<br><span class="mono" style="color:var(--success);font-size:.78rem">'+esc(cell.a)+'</span>');
    }
    let o='';
    list.forEach(x=>{ o+='<option value="'+esc(x)+'"'+(val===x?' selected':'')+'>'+esc(x)+'</option>'; });
    return '<select class="csel" onchange="setCell('+ri+','+ci+',this.value)">'+o+'</select>';
  }
  /* numérique */
  const uv=parseNum(val);
  const ok = (cell.a===null) ? (isNaN(uv)||uv===0) : nearly(uv,cell.a,q.tol);
  if(locked){
    if(ok) return '<span class="mono" style="color:var(--success)">'+(cell.a===null?'—':fmt(cell.a))+'</span>';
    return '<span class="mono" style="color:var(--error);text-decoration:line-through">'+esc(val||'(vide)')+'</span>'
      +'<br><span class="mono" style="color:var(--success);font-size:.78rem">'+(cell.a===null?'(laisser vide)':fmt(cell.a))+'</span>';
  }
  return '<input class="cin" inputmode="decimal" autocomplete="off" placeholder="—" value="'+esc(val)+'" oninput="setCell('+ri+','+ci+',this.value)">';
}

/* Relecture d'une écriture : ce que l'élève a écrit, puis l'écriture correcte */
function tableReview(q,st){
  const m=matchTableRows(q,st.ans);
  const head='<tr>'+q.cols.map(c=>{
    const k=c.toLowerCase();
    const cls=(k.indexOf('débit')>-1||k==='sd')?' class="hd"':(k.indexOf('crédit')>-1||k==='sc')?' class="hc"':'';
    return '<th'+cls+'>'+esc(c)+'</th>';
  }).join('')+'</tr>';

  const allOk = m.ok===m.tot && (st.ans||[]).length===m.tot;
  let mine='<div class="sol-lbl">'+(allOk?'Ton écriture ✓':'Ton écriture')+'</div><div class="qtable-wrap"><table class="qtable">'+head;
  q.rows.forEach((row,ri)=>{
    mine+='<tr class="'+(m.rows[ri]?'rgood':'rbad')+'">';
    row.forEach((cell,ci)=>{
      const txt=cellText(q,cell,(st.ans[ri]||[])[ci]);
      mine+='<td><span class="mono" style="color:'+(m.rows[ri]?'var(--success)':'var(--error)')+'">'+txt+'</span></td>';
    });
    mine+='</tr>';
  });
  mine+='</table></div>';

  let sol='<div class="sol-lbl">Écriture correcte</div><div class="qtable-wrap"><table class="qtable">'+head;
  q.rows.forEach(row=>{
    sol+='<tr class="rgood">';
    row.forEach(cell=>{
      const v=cell.k==='num'?(cell.a===null?'':String(cell.a)):(cell.a==null?'':cell.a);
      sol+='<td><span class="mono fix">'+cellText(q,cell,v)+'</span></td>';
    });
    sol+='</tr>';
  });
  sol+='</table></div>';

  const note='<div class="qsub" style="margin-top:10px">Les lignes peuvent être écrites dans n\'importe quel ordre : seule la correspondance compte / colonne / montant est évaluée.</div>';
  return allOk ? mine+note : mine+sol+note;
}

/* ---------- Interactions ---------- */
function pick(i){ qs().ans=i; renderQBody(); renderAction(); }
function pickMulti(i){ const a=qs().ans, k=a.indexOf(i); if(k>-1)a.splice(k,1); else a.push(i); renderQBody(); renderAction(); }
function setNum(v){ qs().ans=v; const r=tryCalc(v); const el=$('calcPrev');
  if(el) el.textContent = (r!==null) ? '= '+fmt(r) : ''; renderAction(); }
function chipPick(i){ const st=qs(); st.view.sel = (st.view.sel===i?null:i); renderQBody(); }
function chipDrop(b){ const st=qs(); if(st.view.sel==null) return; st.ans[st.view.sel]=b; st.view.sel=null; renderQBody(); renderAction(); }
function chipBack(i){ const st=qs(); st.ans[i]=null; st.view.sel=null; renderQBody(); renderAction(); }
function setMatch(i,v){ qs().ans[i]=v; renderAction(); }
function setFill(i,v){ qs().ans[i]=v; renderAction(); }
function setCell(r,c,v){ qs().ans[r][c]=v; renderAction(); }
function orderAdd(i){ qs().ans.push(i); renderQBody(); renderAction(); }
function orderRemove(pos){ qs().ans.splice(pos,1); renderQBody(); renderAction(); }
function orderReset(){ qs().ans=[]; renderQBody(); renderAction(); }

/* ---------- Complétude & validation ---------- */
function isComplete(q,st){
  switch(q.t){
    case 'qcm': case 'vf': return st.ans!==null;
    case 'multi': return st.ans.length>0;
    case 'num': return !isNaN(parseNum(st.ans))||tryCalc(st.ans)!==null;
    case 'classify': return st.ans.every(v=>v!==null);
    case 'match': return st.ans.every(v=>v!=='');
    case 'fill': return st.ans.every(v=>v!=='');
    case 'order': return st.ans.length===q.items.length;
    case 'table': return q.rows.some((r,ri)=>r.some((c,ci)=>c.k!=='txt'&&String(st.ans[ri][ci]).trim()!==''));
  }
  return false;
}
function scoreParts(q,st){
  let ok=0,tot=0;
  const num=v=>{ const c=tryCalc(v); return c!==null?c:parseNum(v); };
  switch(q.t){
    case 'qcm': case 'vf': tot=1; ok=(st.ans===q.a)?1:0; break;
    case 'multi':
      tot=q.opts.length;
      q.opts.forEach((_,i)=>{ const sel=st.ans.indexOf(i)>-1, good=q.a.indexOf(i)>-1; if(sel===good) ok++; });
      break;
    case 'num': tot=1; ok=nearly(num(st.ans),q.a,q.tol)?1:0; break;
    case 'classify': tot=q.items.length; q.items.forEach((it,i)=>{ if(st.ans[i]===it.b) ok++; }); break;
    case 'match': tot=q.pairs.length; q.pairs.forEach((p,i)=>{ if(st.ans[i]===p.r) ok++; }); break;
    case 'fill': tot=q.a.length; q.a.forEach((v,i)=>{ if(st.ans[i]===v) ok++; }); break;
    case 'order': tot=q.items.length; q.items.forEach((_,i)=>{ if(st.ans[i]===i) ok++; }); break;
    case 'table':
      if(q.anyOrder){ const m=matchTableRows(q,st.ans); return {ok:m.ok, tot:m.tot}; }
      q.rows.forEach((row,ri)=>row.forEach((c,ci)=>{
        if(c.k==='txt') return; tot++;
        const v=st.ans[ri][ci];
        if(c.k==='sel'||c.k==='sel2'){ if((v||'')===c.a || (c.a==='—'&&(v===''||v==='—'))) ok++; }
        else{ const uv=num(v); if(c.a===null? (isNaN(uv)||uv===0) : nearly(uv,c.a,q.tol)) ok++; }
      }));
      break;
  }
  return {ok:ok,tot:tot};
}
/* Normalise les expressions tapées en valeur finale avant verrouillage */
function bakeCalc(q,st){
  const bake=v=>{ const c=tryCalc(v); return c!==null? String(c).replace('.',',') : v; };
  if(q.t==='num') st.ans=bake(st.ans);
  if(q.t==='table') st.ans=st.ans.map((r,ri)=>r.map((v,ci)=> q.rows[ri][ci].k==='num'? bake(v):v ));
}

/* ---------- Correction en deux temps ---------- */
function checkAnswer(){
  const q=qdef(), st=qs();
  if(st.status!==null) return;
  if(!isComplete(q,st)) return;
  bakeCalc(q,st);
  const p=scoreParts(q,st), correct=(p.ok===p.tot);
  st.attempts++;
  st.parts=p;
  if(correct){
    st.status = (st.attempts===1)?'first':'second';
    st.gained = (st.attempts===1)? q.pts : Math.round(q.pts*0.6);
    APP.score+=st.gained; APP.streak++; if(APP.streak>APP.bestStreak)APP.bestStreak=APP.streak;
  } else if(st.attempts>=2){
    st.status='shown'; st.gained=0; APP.streak=0;
  } else {
    APP.streak=0;
  }
  updateHUD(); renderQuestion();
  setTimeout(()=>{ const fb=$('qfb'); if(fb&&fb.firstChild) fb.scrollIntoView({behavior:'smooth',block:'center'}); },60);
}

function renderFeedback(){
  const q=qdef(), st=qs(), el=$('qfb');
  if(!el) return;
  if(st.status==='first'||st.status==='second'){
    const t = st.status==='first' ? '✅ Exact, du premier coup.' : '🔄 C\'est juste au deuxième essai.';
    el.innerHTML='<div class="fb ok"><div class="fbt">'+t+' <span style="color:var(--gold);font-size:.85rem">+'+st.gained+' pts</span></div>'
      +'<p>'+q.ex+'</p></div>';
    return;
  }
  if(st.status==='shown'){
    el.innerHTML='<div class="fb show"><div class="fbt">👁 Voici la réponse et le raisonnement</div>'
      +'<p>'+q.ex+'</p></div>';
    return;
  }
  if(st.attempts===1){
    let part='';
    if(st.parts && st.parts.tot>1) part='<div class="sol"><b>'+st.parts.ok+' / '+st.parts.tot+'</b> éléments sont déjà corrects — corrige les autres.</div>';
    el.innerHTML='<div class="fb hint"><div class="fbt">🤔 Pas encore. Un coup de pouce :</div>'
      +'<p>'+q.hint+'</p>'+part
      +'<div class="sol" style="font-size:.83rem">Il te reste <b>un essai</b>. La fiche théorique est toujours ouverte via le bouton 📖.</div></div>';
    return;
  }
  el.innerHTML='';
}

function renderAction(){
  const q=qdef(), st=qs(), el=$('qact');
  if(!el) return;
  const last = APP.qIndex >= LEVELS[APP.current-1].questions.length-1;
  if(st.status!==null){
    el.innerHTML='<button class="btn btn-primary" onclick="nextQuestion()">'+(last?'Voir le bilan du niveau 🏁':'Question suivante ➜')+'</button>';
  }else{
    const ready=isComplete(q,st);
    el.innerHTML='<button class="btn btn-primary" onclick="checkAnswer()"'+(ready?'':' disabled')+'>'
      +(st.attempts===1?'Vérifier (dernier essai)':'Vérifier')+'</button>';
  }
}

function nextQuestion(){
  const lv=LEVELS[APP.current-1];
  if(APP.qIndex < lv.questions.length-1){ APP.qIndex++; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
  else finishLevel();
}

function levelResults(idx){
  const li=idx-1, lv=LEVELS[li];
  let first=0,second=0,shown=0,pts=0,max=0;
  lv.questions.forEach((q,qi)=>{
    const st=QSTATE[li+'_'+qi]; max+=q.pts;
    if(!st) return;
    if(st.status==='first'){first++;pts+=st.gained;}
    else if(st.status==='second'){second++;pts+=st.gained;}
    else if(st.status==='shown'){shown++;}
  });
  return {first:first,second:second,shown:shown,pts:pts,max:max,total:lv.questions.length};
}
function gradeOf(pct){
  if(pct>=85) return {g:'A',l:'Excellent',msg:"Maîtrise solide : tu peux enchaîner sur les écritures et l'encodage sans filet."};
  if(pct>=65) return {g:'B',l:'Très bien',msg:"Bonne base. Reprends les questions marquées 🔄 : ce sont tes points fragiles, pas tes lacunes."};
  if(pct>=45) return {g:'C',l:'Satisfaisant',msg:"Les mécanismes sont là mais encore hésitants. Relis les fiches théoriques avant de recommencer."};
  return {g:'D',l:'À retravailler',msg:"Reprends la théorie point par point, puis refais le niveau : c'est en manipulant que ça rentre."};
}
function medalOf(pct){ return pct>=90?'🏆':pct>=70?'🥇':pct>=50?'🥈':'🥉'; }

function legendHTML(){

}

    +'<div style="text-align:left"><div class="qsub">Score global : <b style="color:var(--text)">'+tp+' / '+tm+' points ('+pctP+'%)</b></div>'
    +'<div class="bar"><i style="width:'+pctP+'%"></i></div></div>'
    +'<table class="recap"><tr><th>#</th><th>Niveau</th><th class="c">✅</th><th class="c">🔄</th><th class="c">👁</th><th class="c">Points</th><th></th></tr>'+rows+'</table>'
    +'<div class="btn-row" style="justify-content:center">'
      +'<button class="btn btn-acc" onclick="openLB(\'app\')">🏆 Classement du module</button>'
      +'<button class="btn btn-org" onclick="openLB(\'global\')">🌍 Classement général</button></div>'
    +'<div class="btn-row" style="justify-content:center">'
      +'<button class="btn btn-primary" onclick="restartGame()">🔄 Rejouer tout le module</button>'
      +'<button class="btn btn-ghost btn-sm" onclick="goToExercise(0)">🏠 Accueil</button></div>'
    +'</div></div>';
  renderNav(); updateHUD();
  if(pct1>=70) confetti();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Confettis ---------- */
function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer=$('cfLayer'), colors=['#22d68a','#ffd166','#ff8a3d','#4dabf7','#b197fc','#f783ac'];
  for(let i=0;i<80;i++){
    const d=document.createElement('div');
    d.className='cf';
    d.style.left=Math.random()*100+'vw';
    d.style.top='-20px';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(2.2+Math.random()*1.9)+'s';
    d.style.animationDelay=(Math.random()*.7)+'s';
    d.style.borderRadius=Math.random()>.6?'50%':'2px';
    layer.appendChild(d);
    setTimeout(()=>d.remove(),5200);
  }
}

/* ============================================================
   PARTIE 9 — TRACKING (SPEC v5)
   ============================================================ */
function showEmailModal(){
  const ov=$('emailOverlay'); ov.classList.add('open');
  const input=$('emailInput');
  const saved=localStorage.getItem('student_email');
  if(saved) input.value=saved;
  $('emailError').textContent='';
  setTimeout(()=>input.focus(),120);
}

function validateEmail(){
  const input=$('emailInput'), btn=$('emailBtn'), errDiv=$('emailError');
  const email=input.value.trim().toLowerCase();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    errDiv.textContent='⚠️ Entre une adresse email valide.'; input.style.borderColor='#ff4d6d'; return;
  }
  btn.textContent='⏳ Vérification…'; btn.disabled=true; errDiv.textContent=''; input.style.borderColor='';

  const cbName='_emailCb_'+Date.now();
  const timeout=setTimeout(()=>{
    delete window[cbName]; const s=$(cbName); if(s)s.remove();
    errDiv.textContent='⚠️ Connexion impossible. Vérifie ta connexion internet.';
    btn.textContent='Vérifier et commencer'; btn.disabled=false;
  },10000);

  window[cbName]=function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s=$(cbName); if(s)s.remove();
    btn.textContent='Vérifier et commencer'; btn.disabled=false;
    if(resp && resp.found){
      const oldEmail=localStorage.getItem('student_email');
      localStorage.setItem('student_email',email);
      localStorage.setItem('student_classe',resp.classe||'');
      APP.email=email; APP.classe=resp.classe||'';
      if(oldEmail && oldEmail!==email) resetProgression();
      TRACKING.sessionId=new Date().toISOString();
      $('emailOverlay').classList.remove('open');
      startGlobalTimer();
      renderHome();
    }else{
      errDiv.textContent="⚠️ Cette adresse n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
      input.style.borderColor='#ff4d6d';
    }
  };

  const s=document.createElement('script');
  s.id=cbName;
  s.src=TRACKING.scriptUrl+'?action=check_email&email='+encodeURIComponent(email)+'&callback='+cbName;
  s.onerror=function(){
    clearTimeout(timeout); delete window[cbName]; s.remove();
    errDiv.textContent='⚠️ Erreur de connexion au serveur.';
    btn.textContent='Vérifier et commencer'; btn.disabled=false;
  };
  document.body.appendChild(s);
}

function resetProgression(){
  APP.score=0; APP.streak=0; APP.bestStreak=0;
  APP.completed=new Set(); APP.completedExercises=[]; APP.levelStats={};
  APP.exerciseTimes={}; APP.exerciseScores={}; APP.scoreBeforeExercise=0;
  initQuestionState(); updateHUD(); renderNav();
}

/* ---------- Chronomètres ---------- */
function startGlobalTimer(){
  APP.globalTimerStart=Date.now();
  const el=$('globalTimer'); if(el) el.style.display='inline-flex';
  if(APP.globalTimerInterval) clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval=setInterval(updateTimerDisplay,1000);
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const el=$('globalTimer'); if(!el||!APP.globalTimerStart) return;
  const e=Math.floor((Date.now()-APP.globalTimerStart)/1000);
  el.textContent='⏱️ '+String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
}
function startExerciseTimer(exIdx){
  APP.exerciseStartTime=Date.now();
  APP.scoreBeforeExercise=APP.score||0;
}
function stopExerciseTimer(exIdx){
  if(!APP.exerciseStartTime) return null;
  const t=Math.round((Date.now()-APP.exerciseStartTime)/1000);
  APP.exerciseTimes[exIdx]=(APP.exerciseTimes[exIdx]||0)+t;
  APP.exerciseStartTime=null;
  return {temps:APP.exerciseTimes[exIdx]};
}

/* ---------- Complétion d'un niveau ---------- */
function completeExercise(idx){
  if(APP.completedExercises.indexOf(idx)>-1){ stopExerciseTimer(idx); return; }
  APP.completedExercises.push(idx);
  const res=stopExerciseTimer(idx);
  const r=APP.levelStats[idx]||levelResults(idx);
  APP.exerciseScores[idx]=r.pts;
  const niveau='Niveau '+idx+' — '+LEVELS[idx-1].title;
  sendResult(niveau, r.pts, r.max, res?res.temps:(APP.exerciseTimes[idx]||0));
}

function sendResult(niveau,points,pointsMax,temps){
  if(!APP.email) return;
  const payload={
    email:APP.email, classe:APP.classe, app:TRACKING.appName,
    niveau:niveau, points:points, pointsMax:pointsMax, temps:temps,
    totalNiveaux:TRACKING.totalNiveaux, sessionId:TRACKING.sessionId
  };
  console.log('[TRACKING] Envoi:',payload);
  fetch(TRACKING.scriptUrl,{
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify(payload)
  }).catch(err=>console.warn('[TRACKING] Erreur:',err));
}

/* ---------- Classements ---------- */
let currentLBTab='app';
function openLB(tab){ $('lbOverlay').classList.add('open'); switchLBTab(tab||'app'); }
function closeLB(){ $('lbOverlay').classList.remove('open'); }
function switchLBTab(tab){
  currentLBTab=tab;
  const a=$('lbTabApp'), g=$('lbTabGlobal');
  if(tab==='app'){
    a.style.background='var(--accent)'; a.style.color='#07130c'; a.style.borderColor='var(--accent)';
    g.style.background='transparent'; g.style.color='var(--orange)'; g.style.borderColor='var(--orange)';
    $('lbTitle').textContent='🏆 Classement — Module 0'+(APP.classe?' ('+APP.classe+')':'');
  }else{
    g.style.background='var(--orange)'; g.style.color='#180c04'; g.style.borderColor='var(--orange)';
    a.style.background='transparent'; a.style.color='var(--accent)'; a.style.borderColor='var(--accent)';
    $('lbTitle').textContent='🌍 Classement général'+(APP.classe?' ('+APP.classe+')':'');
  }
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab){
  const content=$('lbContent');
  content.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">⏳ Chargement…</div>';
  const action = tab==='app' ? 'leaderboard_app' : 'leaderboard_global';
  const cbName='_lbCb_'+Date.now();
  const timeout=setTimeout(()=>{
    delete window[cbName]; const s=$(cbName); if(s)s.remove();
    content.innerHTML='<div style="text-align:center;padding:40px"><div style="color:var(--error);margin-bottom:12px">⚠️ Connexion impossible</div>'
      +'<button class="btn btn-ghost btn-sm" onclick="fetchLeaderboard(\''+tab+'\')">Réessayer</button></div>';
  },10000);
  window[cbName]=function(resp){
    clearTimeout(timeout); delete window[cbName];
    const s=$(cbName); if(s)s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if(!lbData || lbData.length===0){
      content.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">🏁 Aucun résultat pour le moment</div>'; return;
    }
    renderLeaderboard(lbData,tab);
  };
  let url=TRACKING.scriptUrl+'?action='+action+'&callback='+cbName+'&mode=last';
  if(tab==='app') url+='&app='+encodeURIComponent(TRACKING.appName);
  if(APP.classe) url+='&classe='+encodeURIComponent(APP.classe);
  const s=document.createElement('script');
  s.id=cbName; s.src=url;
  s.onerror=function(){ clearTimeout(timeout); delete window[cbName]; s.remove();
    content.innerHTML='<div style="text-align:center;padding:40px;color:var(--error)">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data,tab){
  const content=$('lbContent');
  const myEmail=(APP.email||'').toLowerCase();
  if(tab==='global' && data.length>0){
    data=data.slice().sort(function(a,b){
      const pa=a.pct||0, pb=b.pct||0;
      if(pb!==pa) return pb-pa;
      return (a.totalTemps||0)-(b.totalTemps||0);
    });
    data.forEach(function(e,i){ e.rang=i+1; });
  }
  const me=data.filter(function(r){return r.email===myEmail;})[0];
  let html='';
  if(me){
    const pct=me.pct!=null?me.pct:(me.pourcentage!=null?me.pourcentage:0);
    const count= tab==='app' ? (me.niveauxCompletes||me.niveaux||0) : (me.appsCompletes||me.apps||0);
    const total= tab==='app' ? (me.totalNiveaux||0) : (me.totalPossibleNiveaux||0);
    const label= tab==='app' ? 'niveaux' : 'apps';
    const prog= total>0 ? count+'/'+total+' '+label : count+' '+label;
    const pc= pct>=80?'var(--success)':pct>=50?'var(--orange)':'var(--error)';
    html+='<div class="lb-me">'
      +'<div><div class="v" style="color:var(--accent)">#'+me.rang+'</div><div class="l">RANG</div></div>'
      +'<div><div class="v">'+me.totalPoints+'</div><div class="l">POINTS</div></div>'
      +'<div><div class="v" style="color:'+pc+'">'+pct+'%</div><div class="l">RÉUSSITE</div></div>'
      +'<div><div class="v" style="color:var(--text2);font-size:1rem">'+prog+'</div><div class="l">PROGRESSION</div></div></div>';
  }
  const medals=['🥇','🥈','🥉'];
  html+='<table class="lb"><tr><th>#</th><th>Élève</th><th style="text-align:right">Pts</th><th style="text-align:right">%</th><th style="text-align:right">Temps</th></tr>';
  data.forEach(function(row){
    const r=row.rang||0;
    const name=nameFromEmail(row.email);
    const pct=row.pct!=null?row.pct:(row.pourcentage!=null?row.pourcentage:0);
    const temps=row.totalTemps||row.totalTime||0;
    const isMe=row.email===myEmail;
    const pc= pct>=80?'var(--success)':pct>=50?'var(--orange)':'var(--error)';
    let tStr='—'; if(temps>0) tStr=fmtTime(temps);
    html+='<tr style="background:'+(isMe?'rgba(34,214,138,.08)':'transparent')+'">'
      +'<td style="font-weight:700">'+(r<=3&&r>=1?medals[r-1]:r)+'</td>'
      +'<td'+(isMe?' style="font-weight:800;color:var(--accent)"':'')+'>'+esc(name)+'</td>'
      +'<td style="text-align:right;font-weight:700;color:var(--accent)">'+row.totalPoints+'</td>'
      +'<td style="text-align:right;font-weight:700;color:'+pc+'">'+pct+'%</td>'
      +'<td style="text-align:right;color:var(--text2)" class="mono">'+tStr+'</td></tr>';
  });
  content.innerHTML=html+'</table>';
}

/* ---------- Rejouer ---------- */
function restartGame(){
  TRACKING.sessionId=new Date().toISOString();   // ⚠️ nouvelle session
  APP.score=0; APP.streak=0; APP.bestStreak=0;
  APP.completed=new Set(); APP.completedExercises=[]; APP.levelStats={};
  APP.exerciseTimes={}; APP.exerciseScores={}; APP.scoreBeforeExercise=0; APP.exerciseStartTime=null;
  APP.current=0; APP.qIndex=0; levelPhase='theory';
  initQuestionState();
  APP.globalTimerStart=Date.now();
  updateHUD(); renderNav();
  showEmailModal();
  renderHome();
}

/* ============================================================
   PARTIE 10 — DÉMARRAGE
   ============================================================ */
function init(){
  initQuestionState();
  renderNav(); updateHUD(); renderHome();
  showEmailModal();     // ← TOUJOURS, même si un email est en localStorage
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeTheory(); closeLB(); }
});
init();
</script>
